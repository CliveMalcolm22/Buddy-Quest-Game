<div class="leaderboard-row {% if player.is_you %}is-you{% endif %}">
  <div class="rank-block">
    {% if player.rank == 1 %}
      <span class="rank gold">1</span>
    {% elif player.rank == 2 %}
      <span class="rank silver">2</span>
    {% elif player.rank == 3 %}
      <span class="rank bronze">3</span>
    {% else %}
      <span class="rank neutral">{{ player.rank }}</span>
    {% endif %}
  </div>

  <div class="player-meta">
    <div class="avatar avatar-sm">
      <span aria-hidden="true">{{ player.initials }}</span>
      <img class="avatar-image" src="{{ url_for('static', path=player.avatar).path }}" alt="" loading="lazy" />
    </div>
    <span>{{ player.name }}</span>
    {% if player.is_you %}
      <span class="you-tag">You</span>
    {% endif %}
  </div>

  <div class="player-score">{{ player.points }}</div>
</div>
